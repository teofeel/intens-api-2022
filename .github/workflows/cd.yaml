name: Deployment pipeline
on:
    push:
        branches:
            - "master"

permissions:
  id-token: write
  contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup java maven
              uses: actions/setup-java@v4
              with: 
                java-version: '8'
                distribution: 'temurin'
                cache: 'maven'

            - name: Build with Maven
              run: ./mvnw clean package -DskipTests

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to azure
              uses: azure/login@v3
              with: 
                client-id: ${{ secrets.AZURE_CLIENT_ID }}  
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}  
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Login to ACR
              run: |
                az acr login --name ${{ secrets.AZURE_REGISTRY_NAME }}

            - name: Build and push docker image
              uses: docker/build-push-action@v5
              with: 
                context: .
                file: ./Dockerfile
                push: true
                tags: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/intenscontainer:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max
            
            - name: Update ACR with new image
              run: |
                az webapp config container set \
                  --name ${{ secrets.AZURE_WEBAPP_NAME }} \
                  --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                  --container-image-name ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/intenscontainer:latest

            - name: Refresh web server
              uses: azure/cli@v2
              with:
                azcliversion: latest
                inlineScript: |
                    az webapp restart --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}



